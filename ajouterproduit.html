<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier un produit - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen">

    <header class="border-b border-slate-800 bg-[#0F172A]/80 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <a href="index.html" class="inline-flex items-center gap-2 text-violet-400 hover:text-violet-300 text-xs font-bold">
                <i class="fas fa-arrow-left"></i> Accueil
            </a>
            <span class="text-xs font-black tracking-wider text-slate-400 uppercase">WiseMarket Togo</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 sm:p-6">
        <div class="bg-[#0F172A] border border-slate-800 rounded-3xl p-6 sm:p-8 glow-violet">
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 rounded-2xl bg-violet-600/20 border border-violet-500/30 mx-auto flex items-center justify-center text-violet-400 mb-3">
                    <i class="fas fa-plus text-xl"></i>
                </div>
                <h1 class="text-xl font-black text-white">Publier un Article</h1>
                <p class="text-xs text-slate-400 mt-1">Espace réservé aux vendeurs certifiés</p>
            </div>

            <form id="formAjoutProduit" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Nom de votre boutique *</label>
                    <input type="text" id="vendeurNom" required placeholder="Ex: Cécile Mode" class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Mot de passe boutique *</label>
                    <input type="password" id="vendeurCode" required placeholder="Votre code secret" class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Nom de l'article *</label>
                    <input type="text" id="produitNom" required placeholder="Ex: Robe de soirée" class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Prix *</label>
                        <input type="text" id="produitPrix" required placeholder="Ex: 8.500 FCFA" class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Catégorie</label>
                        <select id="produitCategorie" class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition">
                            <option value="Mode">Mode & Vêtements</option>
                            <option value="Électronique">Électronique</option>
                            <option value="Beauté">Beauté & Cosmétique</option>
                            <option value="Chaussures">Chaussures</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Photo de l'article</label>
                    <div class="bg-[#090D16] border-2 border-dashed border-slate-800 rounded-xl p-4 text-center">
                        <input type="file" id="fileInput" accept="image/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white hover:file:bg-violet-500 cursor-pointer">
                        <div id="imagePreviewContainer" class="hidden mt-4 flex flex-col items-center gap-2">
                            <img id="imagePreview" src="" alt="Aperçu" class="h-36 object-cover rounded-xl border border-violet-500/50 shadow-md">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Description</label>
                    <textarea id="produitDesc" rows="3" placeholder="Détails du produit..." class="w-full bg-[#090D16] border border-slate-800 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-violet-500 transition"></textarea>
                </div>

                <div id="statusMessage" class="text-xs text-center font-bold hidden p-3 rounded-xl"></div>

                <button type="submit" id="btnSubmit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-violet-600/20">
                    <i class="fas fa-paper-plane"></i> Publier mon article
                </button>
            </form>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let fileSelectionne = null;
        const fileInput = document.getElementById('fileInput');
        const imgPreview = document.getElementById('imagePreview');
        const previewContainer = document.getElementById('imagePreviewContainer');

        if (localStorage.getItem('wm_vendeur_nom')) {
            document.getElementById('vendeurNom').value = localStorage.getItem('wm_vendeur_nom');
        }

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                fileSelectionne = file;
                imgPreview.src = URL.createObjectURL(file);
                previewContainer.classList.remove('hidden');
            }
        });

        function compresserPhoto(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scale = MAX_WIDTH / img.width;
                        canvas.width = scale < 1 ? MAX_WIDTH : img.width;
                        canvas.height = scale < 1 ? img.height * scale : img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.5));
                    };
                };
            });
        }

        document.getElementById('formAjoutProduit').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Vérification...`;
            msg.classList.add('hidden');

            const vendeur = document.getElementById('vendeurNom').value.trim();
            const code = document.getElementById('vendeurCode').value.trim();
            const nom = document.getElementById('produitNom').value.trim();
            const prix = document.getElementById('produitPrix').value.trim();
            const categorie = document.getElementById('produitCategorie').value;
            const description = document.getElementById('produitDesc').value.trim();

            try {
                // 1. Vérification du vendeur et de son mot de passe
                const { data: vData, error: vErr } = await supabase
                    .from('vendeurs')
                    .select('*')
                    .eq('nom_boutique', vendeur)
                    .single();

                if (vErr || !vData) {
                    throw new Error("Boutique introuvable. Veuillez d'abord vous inscrire.");
                }

                if (vData.code_secu !== code) {
                    throw new Error("Mot de passe secret incorrect !");
                }

                if (vData.statut !== 'valide') {
                    throw new Error("⏳ Votre boutique est en cours de vérification par l'administrateur WiseMarket.");
                }

                // 2. Traitement de la photo
                let image_url = 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&q=80';
                if (fileSelectionne) {
                    image_url = await compresserPhoto(fileSelectionne);
                }

                // 3. Publication de l'article
                const { error: pErr } = await supabase
                    .from('produits')
                    .insert([{ vendeur, code_secu: code, nom, prix, categorie, image_url, description }]);

                if (pErr) throw pErr;

                msg.className = "text-xs text-center font-bold p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 block";
                msg.innerText = "✓ Article publié avec succès ! Redirection...";

                setTimeout(() => {
                    window.location.href = `boutique.html?vendeur=${encodeURIComponent(vendeur)}`;
                }, 1000);

            } catch (err) {
                console.error("Erreur:", err);
                msg.className = "text-xs text-center font-bold p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 block";
                msg.innerText = err.message || "Erreur de connexion.";
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> Réessayer`;
            }
        });
    </script>
</body>
</html>
