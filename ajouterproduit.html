<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un produit - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.25); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen p-4 sm:p-8 flex items-center justify-center">

    <div class="max-w-xl w-full bg-[#0F172A] border border-slate-800 rounded-3xl p-6 shadow-2xl glow-violet">
        <a href="index.html" class="inline-flex items-center gap-2 text-violet-400 hover:text-violet-300 text-xs font-bold mb-6">
            <i class="fas fa-arrow-left"></i> Retour à l'accueil
        </a>

        <h1 class="text-xl font-black text-white mb-1">Publier un nouveau produit</h1>
        <p class="text-xs text-slate-400 mb-6">Remplissez les informations ci-dessous pour ajouter votre article sur WiseMarket.</p>

        <form id="produitForm" onsubmit="publierProduit(event)" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Titre / Nom du produit *</label>
                <input type="text" id="nom" required placeholder="Ex: Parfum De Luxe 50ml" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Prix (en FCFA) *</label>
                <input type="text" id="prix" required placeholder="Ex: 5 000 FCFA" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Catégorie *</label>
                <select id="categorie" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-violet-500">
                    <option value="Beauté">Parfums & Beauté</option>
                    <option value="Mode">Mode & Vêtements</option>
                    <option value="Portraits">Portraits & Sur-Mesure</option>
                    <option value="Autre">Autre</option>
                </select>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Description *</label>
                <textarea id="description" rows="3" required placeholder="Description détaillée du produit..." class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-violet-500"></textarea>
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Nom de votre Boutique / Vendeur *</label>
                <input type="text" id="vendeur" required placeholder="Ex: Cécile" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-white outline-none focus:border-violet-500">
            </div>

            <div>
                <label class="block text-slate-300 mb-1 font-semibold">Photo du produit *</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-violet-600 file:text-white">
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/30 cursor-pointer text-sm mt-4">
                Publier le produit
            </button>
        </form>

        <div id="statusMessage" class="hidden mt-4 p-3 rounded-xl text-center text-xs font-bold"></div>
    </div>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzyl.supabase.co";
        const SUPABASE_KEY = "Sb_publishable_HEYqdUqe0zfTb1AodGsxeQ_Fv__b0tF";

        let supabaseClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            console.error("Erreur d'initialisation Supabase:", err);
        }

        async function publierProduit(e) {
            e.preventDefault();

            const btn = document.getElementById('btnSubmit');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerText = "Traitement en cours...";
            status.className = "mt-4 p-3 rounded-xl text-center text-xs font-bold bg-violet-500/20 text-violet-300 block";
            status.innerText = "Publication en cours, veuillez patienter...";

            try {
                if (!supabaseClient) {
                    throw new Error("Connexion à la base de données indisponible. Vérifiez la connexion.");
                }

                const nom = document.getElementById('nom').value.trim();
                const prix = document.getElementById('prix').value.trim();
                const categorie = document.getElementById('categorie').value;
                const description = document.getElementById('description').value.trim();
                const vendeur = document.getElementById('vendeur').value.trim();
                const fileInput = document.getElementById('imageFile');

                let imageUrl = "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&q=80";

                // Tentative d'upload d'image si un fichier est sélectionné
                if (fileInput.files && fileInput.files.length > 0) {
                    try {
                        const file = fileInput.files[0];
                        const fileExt = file.name.split('.').pop();
                        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

                        const { data: uploadData, error: uploadError } = await supabaseClient.storage
                            .from('produits')
                            .upload(fileName, file);

                        if (!uploadError && uploadData) {
                            const { data: urlData } = supabaseClient.storage.from('produits').getPublicUrl(fileName);
                            if (urlData && urlData.publicUrl) {
                                imageUrl = urlData.publicUrl;
                            }
                        } else {
                            console.warn("Storage inaccesible, utilisation de l'image par défaut:", uploadError);
                        }
                    } catch (imgErr) {
                        console.warn("Erreur sur l'image:", imgErr);
                    }
                }

                // Insertion dans la table des produits
                const { data, error } = await supabaseClient
                    .from('produits')
                    .insert([
                        {
                            nom: nom,
                            prix: prix,
                            categorie: categorie,
                            description: description,
                            vendeur: vendeur,
                            image_url: imageUrl
                        }
                    ]);

                if (error) {
                    throw new Error(error.message || "Erreur lors de l'enregistrement dans la table.");
                }

                status.className = "mt-4 p-3 rounded-xl text-center text-xs font-bold bg-emerald-500/20 text-emerald-300 block";
                status.innerText = "🎉 Produit publié avec succès sur WiseMarket !";
                document.getElementById('produitForm').reset();

            } catch (err) {
                console.error("Détails Erreur:", err);
                status.className = "mt-4 p-3 rounded-xl text-center text-xs font-bold bg-red-500/20 text-red-300 block";
                status.innerText = "Impossible de publier : " + (err.message || "Erreur réseau.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Publier le produit";
            }
        }
    </script>
</body>
</html>
