<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen">

    <header class="border-b border-slate-800 bg-[#0F172A]/80 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-sm font-black text-violet-400">WiseMarket Admin</span>
                <span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full">Zone Secrète</span>
            </div>
            <a href="index.html" class="text-slate-400 hover:text-white text-xs font-bold">
                <i class="fas fa-arrow-left"></i> Retour au site
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- SECTION STATISTIQUES EN HAUT -->
        <div class="grid grid-cols-3 gap-3 sm:gap-4">
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-violet-500/10 border border-violet-500/20 text-violet-400 flex items-center justify-center shrink-0">
                    <i class="fas fa-box text-sm"></i>
                </div>
                <div>
                    <h3 id="statArticles" class="text-base sm:text-xl font-black text-white">0</h3>
                    <p class="text-[10px] sm:text-xs text-slate-400">Articles en ligne</p>
                </div>
            </div>

            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
                    <i class="fas fa-store text-sm"></i>
                </div>
                <div>
                    <h3 id="statBoutiques" class="text-base sm:text-xl font-black text-white">0</h3>
                    <p class="text-[10px] sm:text-xs text-slate-400">Boutiques validées</p>
                </div>
            </div>

            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-3 sm:p-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
                    <i class="fas fa-clock text-sm"></i>
                </div>
                <div>
                    <h3 id="statAttente" class="text-base sm:text-xl font-black text-white">0</h3>
                    <p class="text-[10px] sm:text-xs text-slate-400">En attente</p>
                </div>
            </div>
        </div>

        <div class="bg-[#0F172A] border border-slate-800 rounded-3xl p-6 glow-violet">
            <h1 class="text-lg font-black text-white flex items-center gap-2">
                <i class="fas fa-users-cog text-violet-400"></i> Demandes d'inscription Vendeurs
            </h1>
            <p class="text-xs text-slate-400 mt-1">Validez ou refusez les demandes pour autoriser la publication d'articles.</p>
        </div>

        <div id="listeCandidatures" class="space-y-3">
            <p class="text-xs text-slate-400 text-center py-8">Chargement des candidatures...</p>
        </div>

    </main>

    <script>
        // Clé API Supabase réinitialisée et valide
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function chargerStatistiques() {
            try {
                // Total des produits publiés
                const { count: countP } = await db.from('produits').select('*', { count: 'exact', head: true });
                if (countP !== null) document.getElementById('statArticles').textContent = countP;

                // Total boutiques validées
                const { count: countB } = await db.from('vendeurs').select('*', { count: 'exact', head: true }).eq('statut', 'valide');
                if (countB !== null) document.getElementById('statBoutiques').textContent = countB;

                // Total candidatures en attente
                const { count: countA } = await db.from('vendeurs').select('*', { count: 'exact', head: true }).neq('statut', 'valide').neq('statut', 'refuse');
                if (countA !== null) document.getElementById('statAttente').textContent = countA;

            } catch (err) {
                console.error("Erreur chargement des stats:", err);
            }
        }

        async function chargerCandidatures() {
            const container = document.getElementById('listeCandidatures');

            try {
                const { data: vendeurs, error } = await db
                    .from('vendeurs')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!vendeurs || vendeurs.length === 0) {
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">Aucune demande de boutique pour le moment.</p>`;
                    return;
                }

                container.innerHTML = vendeurs.map(v => {
                    const nomComplet = v.nom_prenom || v.nom_vendeur || v.nom || 'Non renseigné';
                    return `
                        <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <h3 class="text-sm font-bold text-white">${v.nom_boutique}</h3>
                                    ${v.statut === 'valide' 
                                        ? '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full">Validé</span>' 
                                        : v.statut === 'refuse'
                                        ? '<span class="bg-red-500/20 text-red-400 border border-red-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full">Refusé</span>'
                                        : '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[9px] font-bold px-2 py-0.5 rounded-full">En attente</span>'
                                    }
                                </div>
                                <p class="text-xs text-slate-300">Responsable : <span class="font-bold text-slate-200">${nomComplet}</span></p>
                                <p class="text-xs text-slate-400"><i class="fab fa-whatsapp text-emerald-400"></i> ${v.whatsapp || '-'} | <i class="fas fa-map-marker-alt text-violet-400"></i> ${v.ville || '-'} | <span class="text-slate-500">Catégorie: ${v.categorie || 'Autre'}</span></p>
                            </div>

                            <div class="flex items-center gap-2 border-t sm:border-t-0 border-slate-800 pt-3 sm:pt-0">
                                ${v.statut !== 'valide' ? `
                                    <button onclick="changerStatut('${v.id}', 'valide')" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
                                        <i class="fas fa-check"></i> Valider
                                    </button>
                                ` : ''}
                                ${v.statut !== 'refuse' ? `
                                    <button onclick="changerStatut('${v.id}', 'refuse')" class="bg-red-600/20 hover:bg-red-600 border border-red-500/30 text-red-300 hover:text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
                                        <i class="fas fa-times"></i> Refuser
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Erreur admin:", err);
                container.innerHTML = `<p class="text-xs text-red-400 text-center py-8">Erreur de chargement des candidatures.</p>`;
            }
        }

        async function changerStatut(id, nouveauStatut) {
            try {
                const { error } = await db
                    .from('vendeurs')
                    .update({ statut: nouveauStatut })
                    .eq('id', id);

                if (error) throw error;
                chargerCandidatures();
                chargerStatistiques(); // Rafraîchit les chiffres immédiatement après action !

            } catch (err) {
                alert("Erreur lors de la mise à jour : " + err.message);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            chargerStatistiques();
            chargerCandidatures();
        });
    </script>
</body>
</html>
