<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen p-4 sm:p-8">

    <main class="max-w-5xl mx-auto space-y-6">
        <!-- Header Admin -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-[#0F172A] border border-slate-800 p-6 rounded-3xl">
            <div>
                <h1 class="text-2xl font-black text-white">Tableau de Bord Administrateur</h1>
                <p class="text-xs text-slate-400">Vue d'ensemble des boutiques et des produits sur WiseMarket</p>
            </div>
            <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2">
                <i class="fas fa-globe"></i> Voir le site
            </a>
        </div>

        <!-- Statistiques -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-6">
                <p class="text-xs font-bold text-slate-400">Nombre de Boutiques</p>
                <p class="text-3xl font-black text-violet-400 mt-2" id="statBoutiques">0</p>
            </div>
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-6">
                <p class="text-xs font-bold text-slate-400">Total Articles en Ligne</p>
                <p class="text-3xl font-black text-emerald-400 mt-2" id="statArticles">0</p>
            </div>
        </div>

        <!-- Liste des Boutiques Inscrites -->
        <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-6">
            <h2 class="text-base font-bold text-white mb-4">Toutes les Boutiques Inscrites</h2>
            <div id="listeBoutiques" class="space-y-3">
                <p class="text-xs text-slate-500">Chargement des données...</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function chargerAdminData() {
            const elStatBoutiques = document.getElementById('statBoutiques');
            const elStatArticles = document.getElementById('statArticles');
            const elListe = document.getElementById('listeBoutiques');

            try {
                // Récupérer tous les produits
                const { data: produits, error } = await supabase
                    .from('produits')
                    .select('*');

                if (error) throw error;

                if (!produits || produits.length === 0) {
                    elStatBoutiques.innerText = "0";
                    elStatArticles.innerText = "0";
                    elListe.innerHTML = `<p class="text-xs text-slate-400">Aucun produit ou boutique enregistré pour le moment.</p>`;
                    return;
                }

                // Compter le total des articles
                elStatArticles.innerText = produits.length;

                // Extraire et compter les vendeurs uniques (boutiques)
                const boutiquesMap = {};
                produits.forEach(p => {
                    const nom = p.vendeur || 'Anonyme';
                    boutiquesMap[nom] = (boutiquesMap[nom] || 0) + 1;
                });

                const listeVendeurs = Object.keys(boutiquesMap);
                elStatBoutiques.innerText = listeVendeurs.length;

                // Afficher la liste des boutiques et leur nombre d'articles
                elListe.innerHTML = listeVendeurs.map(vendeur => `
                    <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-slate-800 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-violet-600/20 text-violet-400 flex items-center justify-center font-bold text-xs">
                                <i class="fas fa-store"></i>
                            </div>
                            <span class="text-xs font-bold text-white">${vendeur}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[11px] bg-slate-800 text-slate-300 font-semibold px-2.5 py-1 rounded-lg">
                                ${boutiquesMap[vendeur]} article(s)
                            </span>
                            <a href="boutique.html?vendeur=${encodeURIComponent(vendeur)}" class="text-xs text-violet-400 hover:underline font-bold">
                                Voir la vitrine →
                            </a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Erreur Admin:", err);
                elListe.innerHTML = `<p class="text-xs text-red-400">Impossible de charger les données. Vérifiez la connexion à Supabase.</p>`;
            }
        }

        chargerAdminData();
    </script>
</body>
</html>
