<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiseMarket - Le marché en ligne togolais</title>
    <!-- CSS Bootstrap ou Tailwind via CDN pour aller vite et gratuit -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans">

    <!-- BARRE DE NAVIGATION (HEADER) -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
            
            <!-- Logo WiseMarket -->
            <div class="flex items-center gap-2">
                <span class="text-2xl font-black tracking-wider text-white">Wise<span class="text-orange-500">Market</span></span>
            </div>

            <!-- Barre de recherche centrée -->
            <div class="flex-1 max-w-md hidden md:flex items-center bg-slate-800 rounded-full px-4 py-2 border border-slate-700 focus-within:border-orange-500">
                <input type="text" placeholder="Rechercher un produit, un parfum, un tableau..." class="bg-transparent w-full outline-none text-sm text-slate-200 placeholder-slate-400">
                <button class="text-orange-500 hover:text-orange-400 ml-2">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <!-- Actions Droite -->
            <div class="flex items-center gap-4 text-sm font-medium">
                <a href="#produits" class="hover:text-orange-400 transition"><i class="fas fa-th-large mr-1"></i> Produits</a>
                <a href="#vendeur" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition"><i class="fas fa-store mr-1"></i> Devenir vendeur</a>
            </div>
        </div>
    </header>

    <!-- SECTION HERO (BANNIÈRE PRINCIPALE) -->
    <section class="max-w-7xl mx-auto px-4 py-16 md:py-24 text-center flex flex-col items-center justify-center">
        
        <!-- Badge Local -->
        <span class="bg-orange-500/10 text-orange-400 border border-orange-500/20 px-3 py-1 rounded-full text-xs font-semibold mb-6">
            🇹🇬 Le marché en ligne togolais
        </span>

        <!-- Titre Impactant -->
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight mb-6">
            Achetez & Vendez <br class="hidden sm:inline" />
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-red-500">Facilement au Togo</span>
        </h1>

        <!-- Slogan -->
        <p class="text-slate-400 max-w-2xl text-base md:text-lg mb-8">
            Trouvez des parfums, des vêtements de qualité et commandez des portraits personnalisés faits par nos artisans locaux. Simple, rapide et sécurisé.
        </p>

        <!-- Boutons d'action -->
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
            <a href="#produits" class="bg-gradient-to-r from-orange-500 to-red-500 hover:opacity-90 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg shadow-orange-500/20 transition text-center">
                <i class="fas fa-shopping-bag mr-2"></i> Voir les produits
            </a>
            <a href="#vendeur" class="bg-slate-900 border border-slate-700 hover:bg-slate-800 text-white font-semibold px-8 py-3.5 rounded-xl transition text-center">
                <i class="fas fa-store mr-2"></i> Devenir vendeur
            </a>
        </div>
    </section>

</body>
</html>
