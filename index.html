<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiseMarket</title>
  <!-- Chargement du SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <h1>WiseMarket</h1>
    <!-- Lien vers la page d'ajout de produit -->
    <a href="ajouterproduit.html">➕ Vendre un produit</a>
  </header>

  <main>
    <h2>Produits disponibles</h2>
    <!-- Emplacement où les produits seront affichés -->
    <div id="liste-produits">
      <p>Chargement des produits...</p>
    </div>
  </main>

  <script>
    // Tes paramètres Supabase configurés
    const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
    const SUPABASE_KEY = "Sb_publishable_HEYqdUqe0zfTb1AodGsxeQ_Fv__b0tF";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Fonction pour charger et afficher la liste des produits
    async function chargerProduits() {
      const { data: produits, error } = await supabase
        .from('produits')
        .select('*')
        .order('created_at', { ascending: false });

      const conteneur = document.getElementById('liste-produits');

      if (error) {
        conteneur.innerHTML = "<p>Erreur lors du chargement des produits.</p>";
        console.error("Erreur Supabase:", error);
        return;
      }

      if (!produits || produits.length === 0) {
        conteneur.innerHTML = "<p>Aucun produit disponible pour le moment.</p>";
        return;
      }

      // Vider le conteneur avant d'ajouter la liste
      conteneur.innerHTML = "";

      // Afficher chaque produit
      produits.forEach(produit => {
        const carteProduit = document.createElement('div');
        carteProduit.innerHTML = `
          <div>
            <img src="${produit.image_url}" alt="${produit.titre}" style="max-width: 200px; display: block;" />
            <h3>${produit.titre}</h3>
            <p><strong>Prix :</strong> ${produit.prix} FCFA</p>
            <p><strong>Catégorie :</strong> ${produit.categorie || 'Non spécifiée'}</p>
            <p><strong>Vendeur :</strong> ${produit.vendeur_nom || 'Anonyme'}</p>
            <p>${produit.description || ''}</p>
          </div>
          <hr />
        `;
        conteneur.appendChild(carteProduit);
      });
    }

    // Lancer la récupération dès le chargement de la page
    chargerProduits();
  </script>
</body>
</html>
