<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Connexion Vendeur - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION -->
    <header class="border-b border-slate-800 bg-[#0F172A]/90 backdrop-blur-md sticky top-0 z-40 p-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-lg font-black text-white tracking-wider flex items-center gap-2">
                Wise<span class="text-emerald-400">Market</span>
            </a>

            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition flex items-center gap-1">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </header>

    <!-- FORMULAIRE DE CONNEXION -->
    <main class="max-w-md mx-auto p-4 sm:p-6 w-full flex-grow flex items-center justify-center">
        
        <div class="w-full bg-[#0F172A] border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6 glow-violet">
            
            <div class="text-center space-y-2">
                <div class="w-12 h-12 bg-violet-600/20 border border-violet-500/30 text-violet-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
                    <i class="fas fa-store"></i>
                </div>
                <h1 class="text-xl font-black text-white">Connexion Vendeur</h1>
                <p class="text-xs text-slate-400">Accédez à votre espace boutique et gérez vos produits.</p>
            </div>

            <form id="formConnexion" onsubmit="connecterBoutique(event)" class="space-y-4">
                
                <!-- NOM DE LA BOUTIQUE -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-300">Nom de votre boutique *</label>
                    <div class="relative">
                        <input type="text" id="nomBoutique" required placeholder="Ex: Wiseboy" class="w-full bg-[#090D16] border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500">
                        <i class="fas fa-shop absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                    </div>
                </div>

                <!-- MOT DE PASSE -->
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-300">Mot de passe *</label>
                    <div class="relative">
                        <input type="password" id="passBoutique" required placeholder="••••••••" class="w-full bg-[#090D16] border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500">
                        <i class="fas fa-lock absolute left-3.5 top-3.5 text-slate-500 text-xs"></i>
                    </div>
                </div>

                <!-- MESSAGE ERREUR / SUCCÈS -->
                <div id="messageStatut" class="hidden text-center text-xs p-3 rounded-xl border"></div>

                <!-- BOUTON SE CONNECTER -->
                <button type="submit" id="btnConnecter" class="w-full bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold py-3.5 rounded-xl transition shadow-lg shadow-violet-600/20 flex items-center justify-center gap-2">
                    <i class="fas fa-sign-in-alt"></i> Se Connecter
                </button>

            </form>

            <div class="border-t border-slate-800 pt-4 text-center text-xs text-slate-400 space-y-2">
                <p>Vous n'avez pas encore de boutique ?</p>
                <a href="inscription.html" class="text-emerald-400 font-bold hover:underline inline-block">
                    Créer Ma Boutique
                </a>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="border-t border-slate-800 bg-[#0F172A] py-4 text-center text-xs text-slate-500">
        <p>© 2026 WiseMarket Togo. Espace vendeur sécurisé.</p>
    </footer>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function connecterBoutique(e) {
            e.preventDefault();
            
            const nomSaisi = document.getElementById('nomBoutique').value.trim();
            const passSaisi = document.getElementById('passBoutique').value.trim();
            const btn = document.getElementById('btnConnecter');
            const msg = document.getElementById('messageStatut');

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Vérification...`;
            msg.className = "hidden text-center text-xs p-3 rounded-xl border";

            try {
                // 1. RECHERCHE DANS LA TABLE VENDEURS (Insensible à la casse)
                const { data: vendeurs, error } = await db
                    .from('vendeurs')
                    .select('*')
                    .ilike('nom_boutique', nomSaisi);

                if (error) throw error;

                // 2. SI LA BOUTIQUE N'EXISTE PAS
                if (!vendeurs || vendeurs.length === 0) {
                    msg.textContent = "Nom de boutique introuvable. Assurez-vous d'avoir créé votre boutique.";
                    msg.classList.remove('hidden');
                    msg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Se Connecter`;
                    return;
                }

                const vendeur = vendeurs[0];

                // 3. VÉRIFICATION DU MOT DE PASSE (Si le champ existe dans Supabase)
                if (vendeur.mot_de_passe && vendeur.mot_de_passe !== passSaisi) {
                    msg.textContent = "Mot de passe incorrect.";
                    msg.classList.remove('hidden');
                    msg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Se Connecter`;
                    return;
                }

                // 4. SAUVEGARDE UNIFORMISÉE ET PROPRE EN LOCALSTORAGE
                localStorage.setItem('wisemarket_boutique', JSON.stringify({ nom_boutique: vendeur.nom_boutique }));
                localStorage.setItem('ma_boutique', vendeur.nom_boutique);

                // Ajout dans la liste des multi-boutiques enregistrées sur le téléphone
                let mesBoutiques = JSON.parse(localStorage.getItem('mes_boutiques')) || [];
                if (!mesBoutiques.some(b => b.nom_boutique.toLowerCase() === vendeur.nom_boutique.toLowerCase())) {
                    mesBoutiques.push({ nom_boutique: vendeur.nom_boutique });
                    localStorage.setItem('mes_boutiques', JSON.stringify(mesBoutiques));
                }
                
                msg.textContent = "Connexion réussie ! Redirection vers votre boutique...";
                msg.classList.remove('hidden');
                msg.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');

                // REDIRECTION PROPRE
                setTimeout(() => {
                    window.location.href = "boutique.html";
                }, 1000);

            } catch (err) {
                console.error("Erreur connexion:", err);
                msg.textContent = "Erreur de connexion au serveur. Veuillez réessayer.";
                msg.classList.remove('hidden');
                msg.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-sign-in-alt"></i> Se Connecter`;
            }
        }
    </script>
</body>
</html>
