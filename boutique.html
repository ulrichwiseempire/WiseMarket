<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Vendeur - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen">

    <header class="border-b border-slate-800 bg-[#0F172A]/80 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <span class="text-sm font-black text-violet-400">WiseMarket</span>
            <a href="index.html" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl transition">
                <i class="fas fa-arrow-left"></i> Accueil
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- En-tête de la Boutique -->
        <div class="bg-[#0F172A] border border-slate-800 rounded-3xl p-6 text-center glow-violet relative overflow-hidden space-y-4">
            <div class="w-20 h-20 rounded-full bg-violet-600/20 border-2 border-violet-500/50 mx-auto flex items-center justify-center text-violet-400 shadow-lg shadow-violet-500/20">
                <i class="fas fa-store text-3xl"></i>
            </div>
            
            <div class="flex items-center justify-center gap-2">
                <h1 id="nomBoutique" class="text-xl font-black text-white">Chargement...</h1>
                <span id="badgeVerifie" class="hidden bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full items-center gap-1">
                    <i class="fas fa-check-circle"></i> Vérifiée
                </span>
            </div>
            
            <p id="descVitrine" class="text-xs text-slate-400">Vitrine officielle des articles disponibles sur WiseMarket Togo.</p>

            <!-- BOUTONS D'ACTION (Partager, Nombre d'articles, Mes Commandes) -->
            <div id="actionsVitrine" class="hidden flex flex-wrap items-center justify-center gap-2 pt-2">
                <span id="compteurArticles" class="bg-[#090D16] border border-slate-800 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                    <i class="fas fa-box text-violet-400"></i> 0 Article(s)
                </span>

                <button onclick="partagerVitrine()" class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 shadow-lg shadow-violet-600/20">
                    <i class="fas fa-share-alt"></i> Partager
                </button>

                <!-- BOUTON MES COMMANDES -->
                <button onclick="ouvrirMesCommandes()" class="w-full mt-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                    <i class="fas fa-box-open"></i> Voir mes commandes reçues
                </button>
            </div>
        </div>

        <!-- ZONE D'AFFICHAGE DES COMMANDES (Initilalement cachée) -->
        <div id="zoneCommandesVendeur" class="hidden space-y-3"></div>

        <!-- Section Articles -->
        <div>
            <h2 class="text-sm font-black text-white flex items-center gap-2 mb-4">
                <i class="fas fa-cubes text-emerald-400"></i> Articles de la boutique
            </h2>

            <div id="grilleArticles" class="grid grid-cols-2 gap-3">
                <p class="text-xs text-slate-400 text-center col-span-full py-8">Chargement de la boutique...</p>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let vendeurNom = urlParams.get('vendeur');

        async function chargerVitrine() {
            const container = document.getElementById('grilleArticles');

            if (!vendeurNom) {
                vendeurNom = localStorage.getItem('maBoutiqueNom') || localStorage.getItem('ma_boutique');
                if (!vendeurNom) {
                    vendeurNom = prompt("Entrez le nom de la boutique à consulter :");
                    if (!vendeurNom) {
                        window.location.href = "index.html";
                        return;
                    }
                }
            }

            try {
                const { data: vData } = await db
                    .from('vendeurs')
                    .select('whatsapp, statut, ville')
                    .eq('nom_boutique', vendeurNom)
                    .maybeSingle();

                let whatsappNum = vData && vData.whatsapp ? vData.whatsapp.replace(/[^0-9]/g, '') : '22872119966';
                if (!whatsappNum.startsWith('228')) {
                    whatsappNum = '228' + whatsappNum;
                }

                const { data: produits, error } = await db
                    .from('produits')
                    .select('*')
                    .eq('nom_boutique', vendeurNom)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                document.getElementById('nomBoutique').innerText = vendeurNom;
                document.getElementById('badgeVerifie').classList.remove('hidden');
                document.getElementById('badgeVerifie').classList.add('inline-flex');
                document.getElementById('actionsVitrine').classList.remove('hidden');
                document.getElementById('actionsVitrine').classList.add('flex');

                if (vData && vData.ville) {
                    document.getElementById('descVitrine').innerText = `Boutique basée à ${vData.ville} — Produits disponibles sur WiseMarket Togo.`;
                }

                if (!produits || produits.length === 0) {
                    document.getElementById('compteurArticles').innerHTML = `<i class="fas fa-box text-violet-400"></i> 0 Article`;
                    container.innerHTML = `<p class="text-xs text-slate-400 text-center col-span-full py-8">Cette boutique n'a pas encore publié d'articles.</p>`;
                    return;
                }

                document.getElementById('compteurArticles').innerHTML = `<i class="fas fa-box text-violet-400"></i> ${produits.length} Article(s)`;

                container.innerHTML = produits.map(p => {
                    const titreProd = p.titre || p.nom || 'Article';
                    const imageProd = p.image_url || 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=600&q=80';
                    const messageWa = encodeURIComponent(`Bonjour ! Je suis intéressé par votre article "${titreProd}" vu sur WiseMarket.`);
                    const lienWa = `https://wa.me/${whatsappNum}?text=${messageWa}`;

                    return `
                        <div class="bg-[#0F172A] border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
                            <div>
                                <img src="${imageProd}" alt="${titreProd}" class="w-full h-36 object-cover" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Introuvable'">
                                <div class="p-3">
                                    <span class="text-[9px] font-bold text-violet-400 uppercase tracking-wider block mb-1">${p.categorie || 'Article'}</span>
                                    <h3 class="text-xs font-bold text-white truncate">${titreProd}</h3>
                                    <p class="text-[11px] font-black text-emerald-400 mt-1">${p.prix || 'Sur devis'}</p>
                                </div>
                            </div>
                            <div class="p-3 pt-0">
                                <a href="${lienWa}" target="_blank" class="w-full bg-emerald-600/20 hover:bg-emerald-600 border border-emerald-500/30 text-emerald-300 hover:text-white py-2 rounded-xl text-[10px] font-bold transition flex items-center justify-center gap-1">
                                    <i class="fab fa-whatsapp"></i> Commander
                                </a>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Erreur vitrine:", err);
                document.getElementById('nomBoutique').innerText = "Erreur";
                container.innerHTML = `<p class="text-xs text-red-400 text-center col-span-full py-8">Erreur de chargement des articles.</p>`;
            }
        }

        // --- GESTION DU TABLEAU DE BORD COMMANDES VENDEUR ---
        async function ouvrirMesCommandes() {
            if (!vendeurNom) {
                alert("Impossible de déterminer le nom de la boutique.");
                return;
            }

            const zoneCommandes = document.getElementById('zoneCommandesVendeur');
            zoneCommandes.classList.toggle('hidden');

            if (!zoneCommandes.classList.contains('hidden')) {
                zoneCommandes.innerHTML = "<p class='text-center text-slate-400 py-4 text-xs'>⌛ Chargement des commandes...</p>";

                const { data: commandes, error } = await db
                    .from('commandes')
                    .select('*')
                    .eq('nom_boutique', vendeurNom)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.error("Erreur SQL :", error);
                    zoneCommandes.innerHTML = "<p class='text-red-400 text-center py-4 text-xs'>Erreur de chargement.</p>";
                    return;
                }

                if (!commandes || commandes.length === 0) {
                    zoneCommandes.innerHTML = `
                        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center">
                            <p class="text-slate-400 text-xs font-medium">Aucune commande reçue pour le moment.</p>
                        </div>`;
                    return;
                }

                zoneCommandes.innerHTML = `
                    <h3 class="text-xs font-bold text-white mb-2 flex items-center gap-2">
                        <i class="fas fa-box text-amber-400"></i> Commandes reçues (${commandes.length})
                    </h3>
                    <div class="space-y-3">
                        ${commandes.map(cmd => {
                            let badgeColor = "bg-amber-500/10 border-amber-500/30 text-amber-300";
                            let statusText = "⏳ En attente";
                            
                            if (cmd.statut === 'ACCEPTE') {
                                badgeColor = "bg-blue-500/10 border-blue-500/30 text-blue-300";
                                statusText = "🔵 En préparation";
                            } else if (cmd.statut === 'LIVRE') {
                                badgeColor = "bg-emerald-500/10 border-emerald-500/30 text-emerald-300";
                                statusText = "✅ Livrée";
                            }

                            // Échappement des apostrophes pour éviter les erreurs JavaScript dans onclick
                            const safeNomClient = (cmd.nom_client || '').replace(/'/g, "\\'");
                            const safeTitreProduit = (cmd.titre_produit || '').replace(/'/g, "\\'");

                            return `
                            <div class="bg-[#0F172A] p-4 rounded-2xl border border-slate-800 space-y-3 text-xs">
                                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                    <span class="font-bold text-white">👤 ${cmd.nom_client || 'Client'}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full border font-bold ${badgeColor}">
                                        ${statusText}
                                    </span>
                                </div>

                                <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
                                    <p class="font-bold text-violet-300">🛍️ ${cmd.titre_produit}</p>
                                    <p class="text-slate-400 mt-0.5">Quantité : <b class="text-white">${cmd.quantite || 1}</b> | Prix : <b class="text-emerald-400">${cmd.prix ? cmd.prix + ' FCFA' : 'N/C'}</b></p>
                                </div>

                                <div class="text-slate-300 space-y-1 bg-slate-900/50 p-2.5 rounded-xl border border-slate-800/50">
                                    <p>📍 <b>Quartier :</b> ${cmd.adresse_livraison || 'Non spécifié'}</p>
                                    <p>📞 <b>Tél :</b> <a href="tel:${cmd.telephone_client}" class="text-violet-400 font-bold underline">${cmd.telephone_client || 'N/C'}</a></p>
                                </div>

                                <div class="flex gap-2 pt-1">
                                    ${cmd.statut === 'EN_ATTENTE_LIVRAISON' || !cmd.statut ? `
                                        <button onclick="changerStatutCommande('${cmd.id}', 'ACCEPTE', '${cmd.telephone_client}', '${safeNomClient}', '${safeTitreProduit}')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl transition">
                                            👍 Accepter
                                        </button>
                                    ` : ''}

                                    ${cmd.statut !== 'LIVRE' ? `
                                        <button onclick="changerStatutCommande('${cmd.id}', 'LIVRE', '${cmd.telephone_client}', '${safeNomClient}', '${safeTitreProduit}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl transition">
                                            ✅ Marquer Livré
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }
        }

        async function changerStatutCommande(idCommande, nouveauStatut, telClient, nomClient, produitNom) {
            // 1. Mise à jour du statut dans Supabase
            const { error } = await db
                .from('commandes')
                .update({ statut: nouveauStatut })
                .eq('id', idCommande);

            if (error) {
                alert("Erreur lors de la mise à jour");
                return;
            }

            // 2. Envoi automatique de la notification WhatsApp au client
            if (telClient && telClient !== 'undefined') {
                let cleanTel = telClient.replace(/[^0-9]/g, '');
                if (!cleanTel.startsWith('228')) cleanTel = '228' + cleanTel;

                let txtMsg = "";
                if (nouveauStatut === 'ACCEPTE') {
                    txtMsg = `Bonjour ${nomClient || ''} ! 👋 Votre commande pour "${produitNom}" a été ACCEPTÉE par notre boutique. Nous préparons votre livraison ! 📦`;
                } else if (nouveauStatut === 'LIVRE') {
                    txtMsg = `Bonjour ${nomClient || ''} ! 🎉 Votre commande pour "${produitNom}" a été marquée comme LIVRÉE. Merci pour votre confiance sur WiseMarket ! ⭐`;
                }

                if (txtMsg) {
                    const waUrl = `https://wa.me/${cleanTel}?text=${encodeURIComponent(txtMsg)}`;
                    window.open(waUrl, '_blank');
                }
            }

            // 3. Recharger l'affichage des commandes
            ouvrirMesCommandes();
        }

        function partagerVitrine() {
            const urlVitrine = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: `Boutique ${vendeurNom}`,
                    text: `Découvrez la boutique ${vendeurNom} sur WiseMarket Togo !`,
                    url: urlVitrine
                });
            } else {
                navigator.clipboard.writeText(urlVitrine);
                alert("Lien de la vitrine copié !");
            }
        }

        document.addEventListener('DOMContentLoaded', chargerVitrine);
    </script>
</body>
</html>
