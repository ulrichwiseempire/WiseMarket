<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrine Vendeur - WiseMarket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glow-violet { box-shadow: 0 0 25px rgba(139, 92, 246, 0.15); }
    </style>
</head>
<body class="bg-[#090D16] text-slate-100 font-sans min-h-screen">

    <header class="border-b border-slate-800 bg-[#0F172A]/80 backdrop-blur-md sticky top-0 z-50 p-4">
        <div class="max-w-xl mx-auto flex items-center justify-between">
            <span class="text-sm font-black text-violet-400">WiseMarket</span>
            <a href="index.html" class="inline-flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-xl transition">
                <i class="fas fa-arrow-left"></i> Accueil
            </a>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 sm:p-6 space-y-6">
        
        <!-- En-tête de la Boutique -->
        <div class="bg-[#0F172A] border border-slate-800 rounded-3xl p-6 text-center glow-violet relative overflow-hidden">
            <div class="w-20 h-20 rounded-full bg-violet-600/20 border-2 border-violet-500/50 mx-auto flex items-center justify-center text-violet-400 mb-4 shadow-lg shadow-violet-500/20">
                <i class="fas fa-store text-3xl"></i>
            </div>
            
            <div class="flex items-center justify-center gap-2">
                <h1 id="nomBoutique" class="text-xl font-black text-white">Vérification...</h1>
                <span id="badgeVerifie" class="hidden bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full items-center gap-1">
                    <i class="fas fa-check-circle"></i> Vérifiée
                </span>
            </div>
            
            <p id="descVitrine" class="text-xs text-slate-400 mt-1">Vitrine officielle des articles disponibles sur WiseMarket Togo.</p>

            <div id="actionsVitrine" class="hidden flex items-center justify-center gap-3 mt-5">
                <span id="compteurArticles" class="bg-[#090D16] border border-slate-800 text-slate-300 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                    <i class="fas fa-box text-violet-400"></i> 0 Article(s)
                </span>
                <button onclick="partagerVitrine()" class="bg-violet-600 hover:bg-violet-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-lg shadow-violet-600/20">
                    <i class="fas fa-share-alt"></i> Partager la vitrine
                </button>
            </div>
        </div>

        <!-- Section Articles -->
        <div>
            <h2 class="text-sm font-black text-white flex items-center gap-2 mb-4">
                <i class="fas fa-cubes text-emerald-400"></i> Articles de la boutique
            </h2>

            <div id="grilleArticles" class="grid grid-cols-2 gap-3">
                <p class="text-xs text-slate-400 text-center col-span-full py-8">Chargement sécurisé de la boutique...</p>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = "https://kaxpmfvrjeksrzylsjsa.supabase.co";
        const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtheHBtZnZyamVrc3J6eWxzanNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMTgyMTEsImV4cCI6MjEwMDg5NDIxMX0.APYwZG-nO3Id-qgsVtYovq4nq94VHu2vWwwlPcrJyZM";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        let vendeurNom = urlParams.get('vendeur');

        async function chargerVitrineSecurisee() {
            const container = document.getElementById('grilleArticles');

            // Si aucun nom dans l'URL, on demande au visiteur/vendeur de saisir le nom ET le code secret
            if (!vendeurNom) {
                vendeurNom = prompt("Entrez le nom de la boutique à consulter :");
                if (!vendeurNom) {
                    window.location.href = "index.html";
                    return;
                }
            }

            try {
                // 1. On cherche les produits de ce vendeur dans Supabase
                const { data: produits, error } = await supabase
                    .from('produits')
                    .select('*')
                    .eq('vendeur', vendeurNom);

                if (error) throw error;

                // 2. Si la boutique n'existe pas ou n'a aucun article
                if (!produits || produits.length === 0) {
                    document.getElementById('nomBoutique').innerText = "Boutique Introuvable";
                    document.getElementById('descVitrine').innerText = "Aucune boutique enregistrée sous ce nom.";
                    container.innerHTML = `<p class="text-xs text-red-400 text-center col-span-full py-8">❌ Cette boutique n'existe pas ou ne contient aucun article.</p>`;
                    return;
                }

                // 3. Sécurité optionnelle : Vérifier si le code secret correspond au premier article enregistré par ce vendeur
                const codeAttendu = produits[0].code_secu;
                if (codeAttendu) {
                    let codeSaisi = localStorage.getItem(`wm_code_${vendeurNom}`);
                    
                    if (!codeSaisi || codeSaisi !== codeAttendu) {
                        codeSaisi = prompt(`Entrez le code secret de la boutique "${vendeurNom}" :`);
                        if (codeSaisi !== codeAttendu) {
                            alert("Code secret incorrect ! Accès refusé.");
                            window.location.href = "index.html";
                            return;
                        }
                        localStorage.setItem(`wm_code_${vendeurNom}`, codeSaisi);
                    }
                }

                // Si tout est valide, on affiche la boutique
                document.getElementById('nomBoutique').innerText = vendeurNom;
                document.getElementById('badgeVerifie').classList.remove('hidden');
                document.getElementById('badgeVerifie').classList.add('flex');
                document.getElementById('actionsVitrine').classList.remove('hidden');
                document.getElementById('compteurArticles').innerHTML = `<i class="fas fa-box text-violet-400"></i> ${produits.length} Article(s)`;

                container.innerHTML = produits.map(p => `
                    <div class="bg-[#0F172A] border border-slate-800 rounded-2xl overflow-hidden shadow-lg flex flex-col justify-between">
                        <div>
                            <img src="${p.image_url}" alt="${p.nom}" class="w-full h-36 object-cover">
                            <div class="p-3">
                                <span class="text-[9px] font-bold text-violet-400 uppercase tracking-wider block mb-1">${p.categorie || 'Article'}</span>
                                <h3 class="text-xs font-bold text-white truncate">${p.nom}</h3>
                                <p class="text-[11px] font-black text-emerald-400 mt-1">${p.prix}</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <a href="https://wa.me/22890000000?text=${encodeURIComponent('Bonjour, je suis intéressé par votre article : ' + p.nom)}" target="_blank" class="w-full bg-violet-600/20 hover:bg-violet-600 border border-violet-500/30 text-violet-300 hover:text-white py-2 rounded-xl text-[10px] font-bold transition flex items-center justify-center gap-1">
                                <i class="fab fa-whatsapp"></i> Commander
                            </a>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error("Erreur:", err);
                document.getElementById('nomBoutique').innerText = "Erreur";
                container.innerHTML = `<p class="text-xs text-red-400 text-center col-span-full py-8">Erreur de chargement de la vitrine.</p>`;
            }
        }

        function partagerVitrine() {
            const urlVitrine = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: `Boutique ${vendeurNom}`,
                    text: `Découvrez les articles de ${vendeurNom} sur WiseMarket Togo !`,
                    url: urlVitrine
                });
            } else {
                navigator.clipboard.writeText(urlVitrine);
                alert("Lien de la vitrine copié !");
            }
        }

        document.addEventListener('DOMContentLoaded', chargerVitrineSecurisee);
    </script>
</body>
</html>
